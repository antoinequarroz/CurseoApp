name: Supabase Backup Restore Drill

on:
  workflow_run:
    workflows: ['Daily Supabase Backup']
    types: [completed]
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: 'Run ID du backup a restaurer (dernier succes si vide)'
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: supabase-backup-restore-drill
  cancel-in-progress: false

jobs:
  restore:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v5

      - name: Installer Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Selectionner la sauvegarde
        id: backup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.backup_run_id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            run_id="$EVENT_RUN_ID"
          elif [[ -n "$INPUT_RUN_ID" ]]; then
            run_id="$INPUT_RUN_ID"
          else
            run_id="$(gh run list \
              --workflow backup.yml \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Run ID invalide" >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Telecharger uniquement l'artefact chiffre
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.backup.outputs.run_id }}
          name: coursia-supabase-backup-${{ steps.backup.outputs.run_id }}
          path: encrypted-backup

      - name: Dechiffrer et verifier l'archive
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE" || { echo "Phrase de dechiffrement absente" >&2; exit 1; }
          checksum="$(find encrypted-backup -maxdepth 1 -type f -name '*.gpg.sha256' -print -quit)"
          archive_gpg="$(find encrypted-backup -maxdepth 1 -type f -name '*.tar.gz.gpg' -print -quit)"
          test -n "$checksum" && test -n "$archive_gpg"
          (cd encrypted-backup && sha256sum --check "$(basename "$checksum")")
          archive="${archive_gpg%.gpg}"
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase-fd 0 \
            --output "$archive" \
            --decrypt "$archive_gpg"
          tar -xzf "$archive"

      - name: Demarrer une cible Supabase vierge
        shell: bash
        run: |
          set -euo pipefail
          mkdir restore-target
          supabase init --workdir restore-target --yes
          supabase start --workdir restore-target

      - name: Restaurer et controler les donnees
        env:
          RESTORE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/verify-backup-restore.sh backup

      - name: Detruire la cible et les fichiers en clair
        if: always()
        shell: bash
        run: |
          supabase stop --workdir restore-target --no-backup || true
          rm -rf backup restore-target encrypted-backup
