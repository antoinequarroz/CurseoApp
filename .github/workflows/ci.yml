# COUR-37 : les commandes ci-dessous sont EXACTEMENT celles documentees
# comme la Definition of Done (docs/DEFINITION_OF_DONE.md §1) et comme les
# scripts npm locaux (package.json) — jamais une variante CI-only, pour
# qu'un echec ici soit toujours reproductible tel quel en local.
#
# "Un echec bloque la fusion" (critere du ticket) est impose par une regle
# de protection de branche GitHub (Settings > Branches > main > Require
# status checks to pass before merging, cocher `quality` et
# `supabase-migrations`) — ce fichier declare seulement les checks, il ne
# peut pas rendre leur succes obligatoire lui-meme (reglage du depot, pas du
# workflow ; necessite un acces admin non disponible depuis cet
# environnement, voir le rapport de ticket).
name: CI Courseo
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Installer les dependances depuis le lockfile (npm ci)
        run: npm ci --legacy-peer-deps
      - name: Lint (npm run lint)
        run: npm run lint
      - name: Verification des types (npm run type-check)
        run: npm run type-check
      - name: Tests + couverture (npm test -- --coverage)
        run: npm test -- --coverage
      - name: Installer le gateway depuis son lockfile
        run: npm ci --prefix services/swissgroceries-gateway --ignore-scripts
      - name: Tester le gateway et son coupe-circuit
        run: npm run test:gateway
      - name: Construire l'image gateway sans la publier
        run: docker build --tag coursia-swissgroceries-gateway:ci services/swissgroceries-gateway

  # COUR-12 : empeche qu'une migration cassee soit fusionnee. Initialise une
  # base Postgres vierge (via le CLI Supabase, Docker deja disponible sur les
  # runners GitHub Actions), applique TOUTES les migrations de
  # supabase/migrations/ dans l'ordre chronologique + supabase/seed.sql, puis
  # verifie que le schema/seed obtenu correspond bien a ce qui est attendu
  # (pas juste "la commande n'a pas plante").
  #
  # Duree observee : ~2-3 min (telechargement des images Docker Supabase,
  # deja mises en cache par les runners GitHub la plupart du temps, puis
  # quelques secondes pour l'application des migrations elles-memes).
  # Prerequis : aucun secret necessaire — la commande cible uniquement une
  # base Postgres locale ephemere au runner, jamais la production.
  supabase-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Secret de test pour les Edge Functions locales (COUR-34)
        # supabase/functions/.env est gitignore (comme tout .env*) — jamais
        # de vrai secret ici, uniquement une valeur fixe pour l'auth du
        # webhook RevenueCat en local/CI (verifiee dans verify-revenuecat-webhook.sh).
        run: |
          echo "REVENUECAT_WEBHOOK_SECRET=secret-test-local-ci" > supabase/functions/.env
          echo "SWISS_GROCERIES_SERVER_ENABLED=false" >> supabase/functions/.env
          echo "SWISS_GROCERIES_SERVER_MODE=canary" >> supabase/functions/.env
          echo "SWISS_GROCERIES_CANARY_USER_IDS=11111111-1111-1111-1111-111111111111" >> supabase/functions/.env
      - name: Demarrer Supabase (applique migrations + seed automatiquement)
        run: supabase start
      - name: Verifier le schema et le seed obtenus
        run: bash scripts/verify-supabase-seed.sh
      - name: Verifier la matrice allergenes/regimes/synonymes (COUR-15)
        run: bash scripts/verify-allergenes.sh
      - name: Verifier la comparaison de prix/formats/enseignes (COUR-16)
        run: bash scripts/verify-prix.sh
      - name: Verifier le pipeline d'import CSV (COUR-17)
        run: bash scripts/verify-import-csv.sh
      - name: Verifier le catalogue initial de recettes (COUR-18)
        run: bash scripts/verify-catalogue.sh
      - name: Verifier les equipements de cuisine et leur isolation RLS (COUR-70)
        run: bash scripts/verify-equipements-cuisine.sh
      - name: Verifier les regles de fraicheur et qualite des prix (COUR-21)
        run: bash scripts/verify-qualite-prix.sh
      - name: Verifier l'isolation RLS entre foyers (COUR-23)
        run: bash scripts/verify-foyers-membres.sh
      - name: Verifier le CRUD membres du foyer avec un compte Famille (COUR-24)
        run: bash scripts/verify-membres-foyer-crud.sh
      - name: Verifier la garde serveur du palier Famille sur les membres du foyer (COUR-35)
        run: bash scripts/verify-membres-foyer-garde-palier.sh
      - name: Verifier la reprise des migrations partagees et leurs acces (COUR-66)
        run: bash scripts/verify-migrations-partagees.sh
      - name: Verifier le planning date multi-semaines (COUR-26)
        run: bash scripts/verify-repas-planifies.sh
      - name: Verifier les adresses de livraison (COUR-28)
        run: bash scripts/verify-adresses-livraison.sh
      - name: Verifier le backend recettes communautaires et la moderation (COUR-29)
        run: bash scripts/verify-recettes-communautaires.sh
      - name: Verifier l'authenticite et l'idempotence du webhook RevenueCat (COUR-34)
        run: bash scripts/verify-revenuecat-webhook.sh
      - name: Verifier la cohorte canary SwissGroceries avec de vrais comptes Auth (COUR-61)
        run: bash scripts/verify-swissgroceries-canary.sh
      # COUR-39 : test d'integration transverse (recettes, planning, foyer,
      # communaute, abonnements) avec deux utilisateurs authentifies distincts.
      # Place en dernier : c'est le seul script qui nettoie integralement ses
      # donnees, il tolere donc les residus laisses par les precedents.
      - name: Verifier les parcours critiques bout-en-bout a deux utilisateurs (COUR-39)
        run: bash scripts/verify-parcours-critiques.sh
      - name: Arreter Supabase
        if: always()
        run: supabase stop --no-backup
